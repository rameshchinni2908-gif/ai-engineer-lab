services:
  - type: web
    name: ai-engineer-lab-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: HOST
        value: 0.0.0.0
      - key: LLM_PROVIDER
        value: mock
      - key: VECTOR_STORE
        value: memory
      - key: DATABASE_PATH
        value: /app/data/lab.db
      - key: LOG_LEVEL
        value: info
      - key: WEB_ORIGIN
        value: https://ai-engineer-lab.vercel.app
    disk:
      name: ai-engineer-lab-data
      mountPath: /app/data
      sizeGB: 1

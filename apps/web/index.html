<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101820" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AI Lab" />
    <meta name="description" content="Hands-on AI engineering lessons, playgrounds, and experiments." />
    <title>AI Engineer Lab</title>
  </head>
  <body>
    <!--
      No-flash theme bootstrap: applies the persisted/system theme to <html>
      BEFORE React mounts. Mirrors the zustand persist storage format used
      by src/stores/theme.ts ("ail-theme" -> { state: { preference } }).
      hooks/useTheme.tsx's <ThemeProvider> takes over for the React lifetime.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("ail-theme");
          var preference = raw ? JSON.parse(raw).state.preference : "system";
          var resolved =
            preference === "system"
              ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : preference;
          if (resolved === "dark") {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.style.colorScheme = "light";
          }
        } catch (e) {
          // localStorage unavailable or malformed - default to light, ThemeProvider will correct it.
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

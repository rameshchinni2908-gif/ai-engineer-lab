# Serves the built SPA and reverse-proxies /api to the api container.
#
# This app is SSE-heavy (every generation/agent/RAG/eval-run endpoint
# streams, see docs/contracts.md §2) - nginx's default proxy buffering would
# hold a response in memory until it's "big enough" or the upstream closes,
# which silently turns every streaming playground into a long pause followed
# by one giant dump instead of a live stream. Buffering/caching are
# explicitly disabled on the /api location for that reason.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any deep route (e.g. /m/rag, /m/agents) must still load
    # index.html on a hard refresh - there is no server-side route for these,
    # React Router owns them client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;

        # Required for SSE: without this, nginx buffers the whole response
        # before sending anything to the browser, and streaming tokens never
        # appear incrementally.
        proxy_buffering off;
        proxy_cache off;
        # Disable chunked transfer re-encoding so the upstream's own SSE
        # framing (event:/data: lines, see contracts.md §2.1) passes through
        # byte-for-byte.
        chunked_transfer_encoding off;

        # SSE connections are long-lived; the default 60s read timeout would
        # kill an idle-but-still-open generation/agent/eval stream well
        # before it naturally completes.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Preserve the upstream's Connection semantics instead of forcing
        # "close", and forward the usual proxy headers.
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

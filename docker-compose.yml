services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - LLM_PROVIDER=${LLM_PROVIDER:-mock}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434}
      - VECTOR_STORE=${VECTOR_STORE:-memory}
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_PATH=/app/data/lab.db
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - api_data:/app/data
    depends_on:
      - qdrant
    # TODO(wave-3 architect): add healthcheck once /health is wired to real readiness checks.

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    # TODO(wave-3 architect): confirm nginx.conf API proxy path matches apps/api routes.

volumes:
  qdrant_data:
  api_data:
